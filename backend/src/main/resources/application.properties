spring.application.name=backend

# SQLite datasource (development/testing)
# Add busy_timeout to handle concurrent access (30 seconds)
spring.datasource.url=jdbc:sqlite:backend.db?busy_timeout=30000
spring.datasource.driver-class-name=org.sqlite.JDBC
# Configure connection pool for SQLite
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Use Flyway for schema migrations (see db/migration/V1__init.sql)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Let Flyway manage schema; disable Hibernate DDL auto
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Configure Hibernate for SQLite concurrency
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

